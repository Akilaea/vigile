# Docs: https://beszel.dev/guide/hub-installation
# Env vars: https://beszel.dev/guide/environment-variables

services:
  vigile:
    image: "henrygd/beszel"
    container_name: "vigile"
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./vigile_data:/vigile_data
