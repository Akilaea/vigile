# Docs: https://beszel.dev/guide/getting-started
# Env vars: https://beszel.dev/guide/environment-variables

services:
  vigile:
    image: henrygd/beszel:latest
    container_name: vigile
    restart: unless-stopped
    environment:
      APP_URL: http://localhost:8090
    ports:
      - 8090:8090
    volumes:
      - ./vigile_data:/vigile_data
      - ./vigile_socket:/vigile_socket
    # healthcheck:
    #   test: ['CMD', '/vigile', 'health', '--url', 'http://localhost:8090']
    #   interval: 120s
    #   start_period: 10s
    #   timeout: 5s

  vigile-agent:
    image: henrygd/beszel-agent:latest
    container_name: vigile-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./vigile_agent_data:/var/lib/vigile-agent
      - ./vigile_socket:/vigile_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /vigile_socket/vigile.sock
      HUB_URL: http://localhost:8090
      TOKEN: <token>
      KEY: "<key>"
    # healthcheck:
    #   test: ['CMD', '/agent', 'health']
    #   interval: 120s
